name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test test_admin.cjs
      - run: test -s index.html && test -s style.css

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Deploy tested commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/momiq
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/momiq' EXIT
          ssh -i ~/.ssh/momiq -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 momiq-deploy@95.182.119.218 "$COMMIT_SHA"
      - name: Verify deployed admin files and backend readiness
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app.js style.css; do
            url="https://admin.momiq.net/admin/$file"
            if [[ "$file" == index.html ]]; then url=https://admin.momiq.net/admin/; fi
            curl --fail --silent --show-error --max-time 15 "$url" | cmp - "$file"
          done
          curl --fail --silent --show-error --max-time 15 https://api.momiq.net/api/ready |
            python3 -c 'import json,re,sys; r=json.load(sys.stdin); sha=r.get("releaseSha"); assert r.get("ok") is True and r.get("mode")=="production" and isinstance(sha,str) and re.fullmatch("[a-f0-9]{40}",sha); print("Serving backend",sha)'
